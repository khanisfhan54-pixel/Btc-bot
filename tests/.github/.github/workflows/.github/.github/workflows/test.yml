name: Run Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - run: pip install pytest pytest-cov

    - run: pytest --cov=. --cov-report=xml

    - uses: codecov/codecov-action@v3
