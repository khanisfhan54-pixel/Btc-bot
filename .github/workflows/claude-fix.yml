name: Claude Auto Fix PR

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install requests

      - name: Run Claude Autofix
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/claude_audit.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b claude-autofix
          git add .
          git commit -m "Claude auto fixes" || echo "No changes"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: claude-autofix
          title: "🤖 Claude Auto Fix"
          body: "Automated fixes by Claude Opus"
        