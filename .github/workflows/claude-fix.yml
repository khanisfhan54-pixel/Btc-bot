name: Claude Auto Fix PR

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  autofix:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # ===============================
      # CHECKOUT
      # ===============================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ===============================
      # SETUP PYTHON
      # ===============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ===============================
      # INSTALL DEPENDENCIES (FIXED)
      # ===============================
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install numpy pytest requests

      # ===============================
      # RUN CLAUDE AUTOFIX
      # ===============================
      - name: Run Claude Autofix
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/claude_audit.py

      # ===============================
      # RUN TESTS (BLOCKER)
      # ===============================
      - name: Run Tests
        run: |
          echo "🧪 Running tests before PR..."
          pytest

      # ===============================
      # CREATE PR (ONLY IF ABOVE PASSES)
      # ===============================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🤖 Claude auto fixes"
          branch: claude-autofix
          title: "🤖 Claude Auto Fix (Validated)"
          body: |
            Automated fixes generated by Claude Opus 4.6

            ✅ Tests passed
            ✅ Safe to review

          base: main
