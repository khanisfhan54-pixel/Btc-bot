name: Claude Auto Fix PR

on:
  workflow_dispatch:   # manual trigger (recommended)
  push:
    branches: [main]   # optional auto trigger

jobs:
  autofix:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # ===============================
      # CHECKOUT
      # ===============================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ===============================
      # SETUP PYTHON
      # ===============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ===============================
      # INSTALL DEPENDENCIES
      # ===============================
      - name: Install dependencies
        run: |
          pip install requests pytest

      # ===============================
      # RUN CLAUDE AUTOFIX
      # ===============================
      - name: Run Claude Autofix
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/claude_audit.py

      # ===============================
      # RUN TESTS (CRITICAL GATE)
      # ===============================
      - name: Run Tests
        run: |
          echo "🧪 Running tests before PR..."
          pytest || exit 1

      # ===============================
      # CREATE PULL REQUEST (ONLY IF TESTS PASS)
      # ===============================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🤖 Claude auto fixes"
          branch: claude-autofix
          title: "🤖 Claude Auto Fix (Validated)"
          body: |
            Automated fixes generated by Claude Opus 4.6

            ✅ Multi-pass audit
            ✅ Bug fixes applied
            ✅ Performance improvements
            ✅ Tests passed before PR

          base: main
          