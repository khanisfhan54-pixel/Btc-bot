name: claude-audit

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Claude Audit
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/claude_audit.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: claude-audit
          path: CLAUDE_AUDIT.md