name: claude-audit

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  claude-audit:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install deps
      - name: Install dependencies
        run: |
          pip install requests

      # Run Claude audit
      - name: Run Claude Audit
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "🚀 Running Claude audit..."
          python scripts/claude_audit.py

      # Upload report
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-audit-report
          path: CLAUDE_AUDIT.md

      # Optional: Print summary in logs
      - name: Show audit output
        run: |
          echo "===== CLAUDE AUDIT OUTPUT ====="
          cat CLAUDE_AUDIT.md