name: React Doctor Full Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  react-doctor:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🟢 Use Node.js 20 (required for React Doctor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🩺 Run React Doctor (full repo scan)
      - name: Run React Doctor scan
        run: npx -y react-doctor@latest . --verbose