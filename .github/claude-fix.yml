name: Claude Auto Fix

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install requests

    - name: Run Claude Audit
      env:
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      run: python scripts/claude_audit.py

    - name: Apply patch
      run: |
        if [ -f fix.patch ]; then
          git apply fix.patch || echo "Patch failed"
        else
          echo "No patch generated"
        fi

    - name: Commit changes
      run: |
        git config --global user.name "ai-bot"
        git config --global user.email "ai@bot.com"

        git checkout -b ai-fix || git checkout ai-fix

        git add .
        git commit -m "AI: Claude auto fix" || echo "No changes to commit"

        git push origin ai-fix || echo "No push needed"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        branch: ai-fix
        title: "AI Fix (Claude)"
        body: "Automated patch generated by Claude"
